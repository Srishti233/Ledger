[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-anchor"
version = "1.0.0"
description = "Anchor Aegis audit logs and Gauntlet reports on a blockchain so later edits are detectable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "web3>=7,<8",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "click>=8.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools.packages.find]
include = ["ledger*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs a real Anvil chain and a built contract (skipped if unavailable)"]

[tool.coverage.run]
source = ["ledger"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Real errors only, so style rules can never fail the build.
select = ["E9", "F"]

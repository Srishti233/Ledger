# Local, free, self-hosted chain. NOTHING here touches a public network or real funds.
name: ledger

services:
  chain:
    image: ghcr.io/foundry-rs/foundry:latest
    # TEST-ONLY deterministic mnemonic: these keys are public knowledge and hold no value.
    entrypoint: ["/bin/sh", "-c"]
    command: ["anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --mnemonic 'test test test test test test test test test test test junk'"]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  ledger:
    build: .
    depends_on:
      chain:
        condition: service_healthy
    environment:
      LEDGER_RPC_URL: "http://chain:8545"
      LEDGER_BATCH_SIZE: "100"
      LEDGER_MAX_WAIT_SECONDS: "300"
      LEDGER_INTERVAL_SECONDS: "30"   # background auto-anchor tick; 0 disables
      # LEDGER_API_KEY: "change-me"   # require X-Ledger-Key on mutating endpoints
      # LEDGER_AEGIS_DB_URL: "postgresql://readonly:...@aegis-db:5432/aegis"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ledger-data:/data

volumes:
  ledger-data:
